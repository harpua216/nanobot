# nanobot-romed.yaml  ← FALLBACK / STANDALONE
#
# Use this only if you want to run nanobot directly on the ROMED8-2T
# (Pop!_OS) without the EliteDesk Proxmox node.
#
# For the full homelab setup (EliteDesk + ROMED) use nanobot-proxmox.yaml.
#
# One-time setup on Pop!_OS:
#   sudo apt install lxc lxc-templates lxc-utils zfsutils-linux
#   sudo lxc-create -n ubuntu-base -t download -- -d ubuntu -r jammy -a amd64
#   sudo zpool create tank <nvme-device>   # spare NVMe on the ROMED

zfs:
  pool: tank
  dataset: nanobot
  compression: lz4
  sessionQuotaGb: 20

env:
  LXC_ROOTFS:
    description: "Path to the extracted LXC rootfs"
    default: "/var/lib/lxc/ubuntu-base/rootfs"

mcpServers:

  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/mcp/context"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_ROOTFS}"

  web-search:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_ROOTFS}"
      memory: 256
      cpus: 1

  python-exec:
    command: uvx
    args: ["mcp-server-exec"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_ROOTFS}"
      memory: 4096
      cpus: 8

agents:

  researcher:
    name: Researcher
    model: "ollama/llama3.3:70b"
    mcpServers: [web-search, filesystem]
    instructions: |
      Save all notes to /mcp/context (ZFS-backed).

  coder:
    name: Coder
    model: "ollama/qwen2.5-coder:32b"
    mcpServers: [filesystem, python-exec]
    instructions: |
      Workspace is /mcp/context. Read before editing.

  orchestrator:
    name: Orchestrator
    model: "ollama/llama3.3:70b"
    agents: [researcher, coder]

publish:
  entrypoint: [orchestrator]
