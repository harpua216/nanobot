# nanobot-romed.yaml
#
# Nanobot on the ROMED8-2T running Pop!_OS.
#
# Current hardware:
#   ROMED8-2T  - AMD EPYC, 88 GB VRAM, Pop!_OS 22.04  ← everything runs here
#   MikroTik   - switch + NAT gateway
#
# Pending:
#   Precision 7910  - arriving soon, will become the Proxmox host
#   (see nanobot-proxmox.yaml for the plan once it arrives)
#
# One-time setup:
#   sudo apt install lxc lxc-templates lxc-utils zfsutils-linux
#   sudo zpool create tank <nvme-device>        # spare NVMe on the ROMED
#   sudo lxc-create -n ubuntu-base -t download -- \
#       -d ubuntu -r jammy -a amd64
#
# Run:
#   ./bin/nanobot run ./nanobot-romed.yaml

# ---------------------------------------------------------------------------
# ZFS context memory (local NVMe on the ROMED)
# ---------------------------------------------------------------------------
zfs:
  pool: tank
  dataset: nanobot
  mountBase: /mnt/nanobot
  compression: lz4
  sessionQuotaGb: 20

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env:
  LXC_ROOTFS:
    description: "Path to the extracted LXC rootfs (from lxc-create)"
    default: "/var/lib/lxc/ubuntu-base/rootfs"

# ---------------------------------------------------------------------------
# MCP Servers
# ---------------------------------------------------------------------------
mcpServers:

  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/mcp/context"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_ROOTFS}"

  web-search:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_ROOTFS}"
      memory: 256
      cpus: 1

  python-exec:
    command: uvx
    args: ["mcp-server-exec"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_ROOTFS}"
      memory: 4096
      cpus: 8

# ---------------------------------------------------------------------------
# Agents
# ---------------------------------------------------------------------------
agents:

  researcher:
    name: Researcher
    model: "ollama/llama3.3:70b"
    mcpServers:
      - web-search
      - filesystem
    instructions: |
      You are a research agent.  Save all notes and findings to
      /mcp/context — it is ZFS-backed so state persists across sessions.
      Create /mcp/context/<topic>/plan.md before starting any research.

  coder:
    name: Coder
    model: "ollama/qwen2.5-coder:32b"
    mcpServers:
      - filesystem
      - python-exec
    instructions: |
      You are a software engineer.  Workspace is /mcp/context.
      Read existing code before editing.  Run tests via python-exec.

  orchestrator:
    name: Orchestrator
    model: "ollama/llama3.3:70b"
    agents:
      - researcher
      - coder
    instructions: |
      Delegate to researcher or coder as appropriate.
      Agents share state through /mcp/context.

publish:
  entrypoint:
    - orchestrator
  name: "ROMED8-2T Agent Host"
  description: "Local LLM agents with ZFS context memory, no Docker"
