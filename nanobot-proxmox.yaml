# nanobot-proxmox.yaml  ← ACTIVE CONFIG
#
# Hardware:
#   EliteDesk      - Proxmox 8, 32 GB RAM  ← nanobot runs here as LXC
#   ROMED8-2T      - Pop!_OS, 88 GB VRAM   ← Ollama inference only
#   Precision 7910 - (in transit, will join later)
#   10G unmanaged switch  - internal backbone
#   MikroTik             - 1G WAN gateway to cable modem
#
# ── ZFS setup on EliteDesk (Proxmox) ─────────────────────────────────────
# Do this once from the Proxmox shell (Datacenter → pve → Shell):
#
#   # Find available disks (look for one that isn't your boot drive):
#   lsblk -o NAME,SIZE,TYPE,MOUNTPOINT
#
#   # Create a single-disk ZFS pool on that drive (replace sdX):
#   zpool create -f tank /dev/sdX
#
#   # Or use the Proxmox web UI:
#   #   pve node → Disks → ZFS → Create ZFS Pool
#   #   Name: tank | RAID level: Single Disk | select the drive
#
#   # Verify:
#   zpool status tank
#   zfs list
#
# ── Nanobot LXC container on Proxmox ─────────────────────────────────────
# Also do this once:
#
#   # Download an Ubuntu 22.04 template:
#   pveam update
#   pveam download local ubuntu-22.04-standard_22.04-1_amd64.tar.zst
#
#   # Create the nanobot container (adjust storage name if not local-zfs):
#   pct create 200 local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst \
#       --hostname nanobot \
#       --storage local-zfs \
#       --rootfs local-zfs:8 \
#       --memory 4096 \
#       --cores 4 \
#       --net0 name=eth0,bridge=vmbr0,ip=dhcp \
#       --unprivileged 1 \
#       --features nesting=1
#
#   pct start 200
#   pct exec 200 -- bash -c "apt update && apt install -y curl nodejs npm"
#   # copy nanobot binary into the container and run it
#
# ── ROMED8-2T: no ZFS needed ─────────────────────────────────────────────
# The ROMED just runs Ollama.  Install once on Pop!_OS:
#
#   curl -fsSL https://ollama.com/install.sh | sh
#   ollama pull llama3.3:70b
#   ollama pull qwen2.5-coder:32b
#   # Ollama listens on 0.0.0.0:11434 by default — accessible from EliteDesk

# ---------------------------------------------------------------------------
# ZFS context memory (on EliteDesk's "tank" pool)
# ---------------------------------------------------------------------------
zfs:
  pool: tank
  dataset: nanobot
  # Default ZFS mountpoint will be /tank/nanobot/...
  # If you want a custom path, uncomment:
  # mountBase: /mnt/nanobot
  compression: lz4
  sessionQuotaGb: 10

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env:
  ROMED_IP:
    description: "IP of the ROMED8-2T on the 10G switch"
    default: "192.168.10.10"   # adjust to your actual address

  LXC_TEMPLATE:
    description: "Proxmox template for MCP server sandboxes"
    default: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"

# ---------------------------------------------------------------------------
# MCP Servers
# ---------------------------------------------------------------------------
mcpServers:

  # Filesystem access — persistent Proxmox LXC (pct create/exec).
  # Each session gets the ZFS dataset bind-mounted at /mcp/context.
  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/mcp/context"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_TEMPLATE}"
      storagePool: local-zfs
      persistent: true
      memory: 512
      cpus: 2

  web-search:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_TEMPLATE}"
      storagePool: local-zfs
      memory: 256
      cpus: 1

  python-exec:
    command: uvx
    args: ["mcp-server-exec"]
    sandboxed: true
    sandboxType: lxc
    lxc:
      template: "${LXC_TEMPLATE}"
      storagePool: local-zfs
      memory: 2048
      cpus: 4

# ---------------------------------------------------------------------------
# Agents  (inference on ROMED8-2T via 10G link)
# ---------------------------------------------------------------------------
agents:

  researcher:
    name: Researcher
    model: "ollama/${ROMED_IP}:11434/llama3.3:70b"
    mcpServers:
      - web-search
      - filesystem
    instructions: |
      Save all notes to /mcp/context.  Create /mcp/context/<topic>/plan.md
      before starting any research.  State persists via ZFS snapshots.

  coder:
    name: Coder
    model: "ollama/${ROMED_IP}:11434/qwen2.5-coder:32b"
    mcpServers:
      - filesystem
      - python-exec
    instructions: |
      Workspace is /mcp/context.  Read existing code before editing.
      Verify changes by running tests in python-exec.

  orchestrator:
    name: Orchestrator
    model: "ollama/${ROMED_IP}:11434/llama3.3:70b"
    agents:
      - researcher
      - coder
    instructions: |
      Delegate to researcher or coder as appropriate.
      Both agents share state through /mcp/context.

publish:
  entrypoint:
    - orchestrator
  name: "Homelab Agent Host"
  description: "Proxmox LXC + ZFS context memory, ROMED inference"
